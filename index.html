<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Study</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }
  
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
    }
  
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: linear-gradient(to right, #007bff, #00c6ff);
      color: white;
      position: relative;
      z-index: 10;
    }
  
    .logo {
      font-size: 24px;
      font-weight: bold;
      color: white;
    }
  
    .hamburger {
      display: none;
      cursor: pointer;
      font-size: 28px;
      z-index: 11;
      color: white;
    }
  
    nav ul {
      display: flex;
      gap: 20px;
      list-style: none;
    }
  
    nav ul li a {
      text-decoration: none;
      color: white;
      position: relative;
    }
  
    nav ul li a:hover {
      color: #ffe600;
    }
  
    .dropdown {
      position: relative;
    }
  
    .dropdown-menu {
      display: none;
      position: absolute;
      background-color: white;
      top: 100%;
      left: 0;
      list-style: none;
      padding: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border-radius: 8px;
    }
  
    .dropdown:hover .dropdown-menu {
      display: block;
      animation: fadeIn 0.3s ease;
    }
  
    .dropdown-menu li {
      padding: 5px 0;
    }
  
    .dropdown-menu li a {
      color: black;
      padding: 5px 10px;
      border-radius: 5px;
      display: block;
    }
  
    .dropdown-menu li a:hover {
      background-color: #f1f1f1;
    }
  
    .hero {
      padding: 100px 20px;
      text-align: center;
      background: linear-gradient(to right, #e6f0ff, #d1ecff);
    }
  
    .hero h1 {
      font-size: 32px;
      margin-bottom: 20px;
      color: #003366;
    }
  
    .browse-btn {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      animation: pulse 2s infinite;
    }
  
    .browse-btn:hover {
      background-color: #0056b3;
      transform: scale(1.05);
    }
  
    @media (max-width: 768px) {
      .hamburger {
        display: block;
      }
  
      nav ul {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 60px;
        left: 0;
        width: 100%;
        background-color: #007bff;
        padding: 20px 0;
        box-shadow: 0 5px 10px rgba(0,0,0,0.1);
      }
  
      nav ul.active {
        display: flex;
      }
  
      nav ul li a {
        color: white;
        padding: 10px 20px;
      }
  
      .dropdown-menu {
        position: static;
        box-shadow: none;
        padding-left: 20px;
      }
    }
  
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">📘 Simple-Study</div>
    <div class="hamburger" onclick="toggleMenu()">☰</div>
    <nav>
      <ul id="navList">
        <li><a href="https://p-sample34.github.io/main-website/">Home</a></li>
        <li><a href="https://p-sample34.github.io/main-website/ssvt2-main/">About</a></li>
        <li><a href="https://p-sample34.github.io/main-website/contact.html">Contact</a></li>
        <li><a href="https://p-sample34.github.io/main-website/frontend/hub%20webNOTES/">NOTES</a></li>

        <li class="dropdown">
          <a href="#">EXAM-PAPER ▼</a>
          <ul class="dropdown-menu">
            <li><a href="https://user247a.github.io/class-vi-exam-paper/viewer.html">CLASS VI</a></li>
            <li><a href="https://user247a.github.io/class-vii-exam-paper/viewer.html">CLASS VII</a></li>
            <li><a href="https://user247a.github.io/class-viii-exam-paper/viewer.html">CLASS VIII</a></li>
            <li><a href="https://user247a.github.io/class-ix-exam-paper/viewer.html">CLASS IX</a></li>
            <li><a href="https://user247a.github.io/class-x-exam-paper/viewer.html">CLASS X</a></li>
          </ul>
        </li>

        <li class="dropdown">
          <a href="#">TEST ▼</a>
          <ul class="dropdown-menu">
            <li><a href="https://p-sample34.github.io/main-website/hompage-6th-main/CLASS%20VI/">Class 6</a></li>
            <li><a href="https://p-sample34.github.io/main-website/hompage-6th-main/CLASS%20VII/">Class 7</a></li>
            <li><a href="https://p-sample34.github.io/main-website/hompage-6th-main/CLASS%20VIII/">Class 8</a></li>
            <li><a href="https://p-sample34.github.io/main-website/hompage-6th-main/CLASS%20IX/">Class 9</a></li>
            <li><a href="https://p-sample34.github.io/main-website/hompage-6th-main/CLASS%20X/">Class 10</a></li>
          </ul>
        </li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="content">
      <h1>Learn Fast Grow Fast</h1>
      <button class="browse-btn" onclick="openMap()">Get Direction</button>
    </div>
  </section>

  <script>
    function toggleMenu() {
      const navList = document.getElementById("navList");
      navList.classList.toggle("active");
    }

    function openMap() {
      const latitude = 19.468190394468106;
      const longitude = 82.80674060034208;
      const url = `https://www.google.com/maps/dir/?api=1&destination=${latitude},${longitude}`;
      window.open(url, "_blank");
    }
  </script>
</body>
</html>
