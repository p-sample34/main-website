<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Study</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #f9f9f9, #e6f0ff);
      color: #333;
    }

    header {
      background-color: #003366;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 1.5em;
      font-weight: bold;
    }

    nav ul {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    nav ul li {
      position: relative;
    }

    nav ul li a {
      text-decoration: none;
      color: white;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    nav ul li a:hover {
      color: #ffcc00;
    }

    /* Dropdown Styles */
    .dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      background-color: white;
      color: #333;
      min-width: 180px;
      border-radius: 8px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
      display: none;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: all 0.3s ease;
      z-index: 999;
    }

    .dropdown.open {
      display: block;
      opacity: 1;
      max-height: 500px;
    }

    .dropdown a {
      display: block;
      padding: 10px;
      text-decoration: none;
      color: #222;
      transition: background 0.2s ease;
    }

    .dropdown a:hover {
      background: #f0f0f0;
    }

    /* Arrow Animation */
    nav ul li > a::after {
      content: " ▼";
      transition: transform 0.3s ease;
    }

    nav ul li > a.active::after {
      transform: rotate(180deg);
    }

    /* Hamburger Menu */
    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      width: 25px;
      height: 20px;
      justify-content: space-between;
    }

    .hamburger span {
      display: block;
      height: 3px;
      width: 100%;
      background: white;
      border-radius: 5px;
      transition: all 0.3s ease;
    }

    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translateY(8px);
    }

    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translateY(-8px);
    }

    /* Responsive Styles */
    @media (max-width: 768px) {
      nav ul {
        position: absolute;
        top: 60px;
        right: 0;
        background-color: #003366;
        flex-direction: column;
        width: 220px;
        height: 0;
        overflow: hidden;
        border-radius: 0 0 10px 10px;
        transition: all 0.3s ease;
      }

      nav ul.active {
        height: auto;
        max-height: 80vh;
        padding: 10px 0;
        overflow-y: auto;
      }

      nav ul li {
        text-align: center;
        width: 100%;
      }

      nav ul li a {
        display: block;
        padding: 10px 0;
        width: 100%;
      }

      .hamburger {
        display: flex;
      }
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 100px 20px;
      background: linear-gradient(to right, #cce0ff, #e6f0ff);
    }

    .hero h1 {
      font-size: 2.5em;
      color: #003366;
    }

    .hero p {
      font-size: 1.1em;
      color: #333;
      margin-top: 10px;
    }

    /* === Student Photos Section === */
    .photos-section {
      padding: 60px 20px;
      text-align: center;
    }

    .photos-section h2 {
      font-size: 2em;
      color: #003366;
      margin-bottom: 20px;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .photo-grid img {
      width: 100%;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .photo-grid img:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }

    /* Footer */
    footer {
      background-color: #003366;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 0.9em;
      margin-top: 50px;
    }

    footer a {
      color: #ffcc00;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">Smart Study</div>
    <div class="hamburger" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <nav>
      <ul id="navList">
        <li><a href="https://p-sample34.github.io/main-website/ssvt2-main/index.html">Home</a></li>
        <li><a href="https://p-sample34.github.io/ssvt-media/public/viewer.html">about</a></li>
        <li><a href="https://p-sample34.github.io/main-website/contact.html">contact</a></li>
        <li><a href="https://p-sample34.github.io/main-website/frontend/hub%20webNOTES/">Notes</a></li>
        <li><a href="https://p-sample34.github.io/main-website/student%20data%20hub.html">Student-data</a></li>

        <li>
          <a href="#">Test</a>
          <div class="dropdown">
            <a href="https://p-sample34.github.io/main-website/underprogress.html">Chapter Test</a>
            <a href="https://p-sample34.github.io/online-class/public/login.html">Full Online Test</a>
          </div>
        </li>

        
      </ul>
    </nav>
  </header>

  <section class="hero">
    <h1>Welcome to Smart Study</h1>
    <p>Your one-stop destination for Notes, Test Papers, and Learning Materials</p>
  </section>

  <!-- === Added Student Photos Section === -->
  <section class="photos-section">
    <h2>Our Smart Students</h2>
    <div class="photo-grid">
      <img src="https://images.unsplash.com/photo-1596495577886-d920f1fb7238" alt="Student studying" />
      <img src="https://images.unsplash.com/photo-1600880292203-757bb62b4baf" alt="Group of students" />
      <img src="https://unsplash.com/photos/e-learning-graduate-certificate-program-concept-a-person-with-a-light-bulb-symbolizing-elearning-with-icons-education-online-courses-and-certification-programs-the-future-of-digital-education-mpAwtcVBx-w" alt="Student learning online" />
      <img src="https://images.unsplash.com/photo-1523580846011-d3a5bc25702b" alt="Happy student" />
    </div>
  </section>

  <footer>
    <p>© 2025 Smart Study | Designed for Students | <a href="#">Privacy Policy</a></p>
  </footer>

  <script>
    const hamburger = document.getElementById('hamburger');
    const navList = document.getElementById('navList');
    const dropdownToggles = document.querySelectorAll('nav ul li > a');

    // Hamburger menu toggle
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      navList.classList.toggle('active');
    });

    // Dropdown open/close toggle
    dropdownToggles.forEach(link => {
      link.addEventListener('click', e => {
        const parent = link.parentElement;
        const dropdown = parent.querySelector('.dropdown');

        if (dropdown) {
          e.preventDefault();
          document.querySelectorAll('.dropdown').forEach(d => {
            if (d !== dropdown) d.classList.remove('open');
          });
          document.querySelectorAll('nav ul li > a').forEach(a => {
            if (a !== link) a.classList.remove('active');
          });

          dropdown.classList.toggle('open');
          link.classList.toggle('active');
        }
      });
    });
  </script>
</body>
</html>
