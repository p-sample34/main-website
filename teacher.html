<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Study-Teacher panel</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: linear-gradient(to right, #007bff, #00c6ff);
      color: white;
      position: relative;
      z-index: 10;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: white;
    }

    .hamburger {
      display: none;
      cursor: pointer;
      font-size: 30px;
      z-index: 11;
      color: white;
    }

    nav ul {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    nav ul li a {
      text-decoration: none;
      color: white;
    }

    nav ul li a:hover {
      color: #ffe600;
    }

    /* Smooth Slide Menu */
    @media (max-width: 768px) {
      .hamburger {
        display: block;
      }

      nav ul {
        flex-direction: column;
        position: fixed;
        top: 60px;
        left: -100%;
        width: 60%;
        height: 100vh;
        background-color: #007bff;
        padding-top: 30px;
        transition: left 0.4s ease-in-out;
      }

      nav ul.active {
        left: 0;
      }

      nav ul li {
        padding: 15px 20px;
      }

      nav ul li a {
        color: white;
        font-size: 18px;
      }
    }

    /* HERO SECTION */
    .hero {
      padding: 80px 20px;
      text-align: center;
      background: linear-gradient(to right, #e6f0ff, #d1ecff);
    }

    .hero h1 {
      font-size: 34px;
      margin-bottom: 25px;
      color: #003366;
    }

    .hero-img-container {
      display: flex;
      justify-content: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    .hero-card {
      background: #fff;
      width: 280px;
      padding: 15px;
      border-radius: 15px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      text-align: center;
      animation: fadeIn 1s ease forwards;
    }

    .hero-card img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .hero-card p {
      color: #003366;
      font-weight: 600;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">📘 Smart Study</div>
    <div class="hamburger" onclick="toggleMenu()">☰</div>
    <nav>
      <ul id="navList">
        <li><a href="https://p-sample34.github.io/main-website/">Home Student panel</a></li>
        <li><a href="https://p-sample34.github.io/ssvt-media/public/uploader.html"> Upload-About</a></li>
        <li><a href="#">Test</a></li>
        <li><a href="https://p-sample34.github.io/main-website/frontend/upload.html">Notes</a></li>
        <li><a href="https://p-sample34.github.io/main-website/student%20data%20upload%20hub.html">Student Data</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section Edited -->
  <section class="hero">
    <h1>Welcome to Smart Study</h1>
    <div class="hero-img-container">
      
      <div class="hero-card">
        <img src="https://i.postimg.cc/8c7xH8qk/study1.jpg" alt="Study Material">
        <p>Access Quality Notes</p>
      </div>

      <div class="hero-card">
        <img src="https://i.postimg.cc/6Q8J6RWk/exam.jpg" alt="Exam Prep">
        <p>Prepare for Exams</p>
      </div>

      <div class="hero-card">
        <img src="https://i.postimg.cc/Hkv8dVCf/teach.jpg" alt="Teachers">
        <p>Support for Teachers</p>
      </div>

    </div>
  </section>

<script>
  function toggleMenu() {
    document.getElementById("navList").classList.toggle("active");
  }
</script>

</body>
</html>
